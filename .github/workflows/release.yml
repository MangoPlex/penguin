name: Build Alpine package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Alpine APK
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag version
        run: |
          expected_tag="v$(sed -n 's/^pkgver=//p' APKBUILD)"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Install Alpine build dependencies
        run: apk add --no-cache abuild build-base cargo cmake openssl opus-dev pkgconf rust

      - name: Build APK
        run: |
          adduser -D builder
          addgroup builder abuild
          chown -R builder:abuild "$GITHUB_WORKSPACE"
          su - builder -s /bin/sh -c "abuild-keygen -a -n && cd '$GITHUB_WORKSPACE' && abuild -r"
          mkdir -p /tmp/apk-artifacts
          find /home/builder/packages -type f -name '*.apk' -exec cp {} /tmp/apk-artifacts/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-apk
          path: /tmp/apk-artifacts/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: alpine-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
