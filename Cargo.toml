[package]
name = "penguin"
version = "1.2.7"
edition = "2024"

[dependencies]
poise = "0.6"
songbird = "0.6"

tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

rand = "0.10"
url = "2.5"

regex-lite = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

mimalloc = "0.1"
sysinfo = "0.37"

dotenvy = "0.15"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
